name: sopkathon

services:
  app:
    # GitHub Actions가 Docker Hub에 올린 image tag를 사용한다.
    # 예: DOCKERHUB_USERNAME/sopkathon-server:sha-1234abcd5678
    image: ${APP_IMAGE:?APP_IMAGE 값을 설정하세요}
    container_name: sopkathon-app
    restart: unless-stopped
    environment:
      # 같은 image라도 실행 시점의 profile/env로 local/dev/prod 동작을 나눈다.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: ${SERVER_PORT:-8080}
      # 작은 EC2에서 JVM이 메모리를 과하게 잡지 않도록 CD가 기본값을 주입한다.
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:-}
      # update=보존, create=초기화, validate=검증.
      DB_DDL_AUTO: ${DB_DDL_AUTO:-update}
      DB_DEFER_DATASOURCE_INITIALIZATION: ${DB_DEFER_DATASOURCE_INITIALIZATION:-true}
      DB_URL: ${DB_URL:?DB_URL 값을 설정하세요}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME 값을 설정하세요}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 값을 설정하세요}
      # always=seed 실행, never=끄기.
      DB_SQL_INIT_MODE: ${DB_SQL_INIT_MODE:-never}
      DB_SQL_INIT_DATA_LOCATIONS: ${DB_SQL_INIT_DATA_LOCATIONS:-optional:classpath:db/seed/local-test-account.sql}
      APP_SECURITY_PERMIT_ALL: ${APP_SECURITY_PERMIT_ALL:-false}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}
      APP_CORS_ALLOWED_METHODS: ${APP_CORS_ALLOWED_METHODS:-GET,POST,PUT,PATCH,DELETE,OPTIONS}
      APP_CORS_ALLOWED_HEADERS: ${APP_CORS_ALLOWED_HEADERS:-*}
      APP_CORS_EXPOSED_HEADERS: ${APP_CORS_EXPOSED_HEADERS:-Authorization,Location}
      APP_CORS_ALLOW_CREDENTIALS: ${APP_CORS_ALLOW_CREDENTIALS:-true}
      APP_JWT_ISSUER: ${APP_JWT_ISSUER:-sopkathon}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET 값을 설정하세요}
      APP_JWT_ACCESS_TOKEN_EXPIRATION_MINUTES: ${APP_JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:-2880}
      APP_SWAGGER_SERVER_URL: ${APP_SWAGGER_SERVER_URL:-http://localhost:8080}
      APP_SWAGGER_SERVER_DESCRIPTION: ${APP_SWAGGER_SERVER_DESCRIPTION:-Production}
    ports:
      # HOST_PORT는 EC2 외부에 열 포트, SERVER_PORT는 컨테이너 내부 Spring Boot 포트다.
      - "${HOST_PORT:-8080}:${SERVER_PORT:-8080}"
