name: sopkathon

services:
  app:
    image: ${APP_IMAGE:-sopkathon:latest}
    container_name: sopkathon-app
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: ${SERVER_PORT:-8080}
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      APP_JWT_ISSUER: ${APP_JWT_ISSUER:-sopkathon}
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      APP_JWT_ACCESS_TOKEN_EXPIRATION_MINUTES: ${APP_JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:-60}
      APP_JWT_REFRESH_TOKEN_EXPIRATION_DAYS: ${APP_JWT_REFRESH_TOKEN_EXPIRATION_DAYS:-14}
      APP_SWAGGER_SERVER_URL: ${APP_SWAGGER_SERVER_URL}
      APP_SWAGGER_SERVER_DESCRIPTION: ${APP_SWAGGER_SERVER_DESCRIPTION:-Production}
    ports:
      - "${SERVER_PORT:-8080}:8080"
