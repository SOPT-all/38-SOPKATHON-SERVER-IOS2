
# 원격 개발 환경 설정. 초기화해도 되는 EC2/RDS 실험 서버에서 사용한다.

spring:
  datasource:
    # dev는 초기화해도 되는 원격 실험 서버용이다. 값은 .env 또는 배포 환경변수로 넣는다.
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    # dev는 실험 서버를 빠르게 초기화하는 용도라 DB_DDL_AUTO 기본 create를 그대로 따른다.
    # 데이터를 보존해야 하는 원격 서버는 prod profile 또는 DB_DDL_AUTO=update를 사용한다.
    # 공유 서버 로그가 너무 길어지지 않게 SQL 출력은 끈다.
    show-sql: false
  sql:
    init:
      # dev 기본은 seed 끄기.
      mode: ${DB_SQL_INIT_MODE:never}

logging:
  level:
    org.sopt.sopkathon: info
